<om-starry-sky
  [shootingStarsConfig]="{ minDelay: 500, maxDelay: 3000 }"
  [starsBackgroundConfig]="{ starDensity: 0.0015 }"
>
  <div class="content">
    <h1>
      <om-cryptic-text [text]="title()"></om-cryptic-text>
    </h1>
    <h2>
      <om-cryptic-text [text]="subtitle()"></om-cryptic-text>
    </h2>
  </div>
</om-starry-sky>
